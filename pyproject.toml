[project]
name = "logparse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
logparse = "logparse.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
